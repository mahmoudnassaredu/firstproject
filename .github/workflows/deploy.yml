name: Deploy React App

on: 
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Dependencies and Build React App
        run: |
          npm install
          npm run build

      - name: Prepare Deployment Package
        run: |
          # If using a Node platform that serves the 'build' folder, 
          # make sure your package.json has a proper start script.
          zip -r deploy.zip . -x '*.git*' 'node_modules/*'

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: "mahmoud"
          environment_name: "Mahmoud-env "
          version_label: "commit-${{ github.sha }}"
          region: "eu-north-1"
          deployment_package: "deploy.zip"